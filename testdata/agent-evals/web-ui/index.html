<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task List</title>
    <style>
      body { font: 1rem/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 42rem; padding: 2rem 1rem; }
      button { cursor: pointer; font: inherit; padding: .55rem .85rem; }
      li { margin-block: .5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>My tasks</h1>
      <p id="empty-state">No tasks yet.</p>
      <ul id="tasks" aria-label="Tasks"></ul>
      <button id="add-task" type="button">Create task</button>
    </main>
    <script>
      const button = document.querySelector('#add-task');
      const emptyState = document.querySelector('#empty-state');
      const tasks = document.querySelector('#tasks');
      let count = 0;
      button.addEventListener('click', () => {
        count += 1;
        const item = document.createElement('li');
        item.textContent = `Task ${count}`;
        tasks.append(item);
        emptyState.hidden = true;
      });
    </script>
  </body>
</html>
